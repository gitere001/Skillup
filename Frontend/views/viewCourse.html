<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/viewCourse.css">
    <title>Course Details</title>
</head>
<body>
    <a id="back-btn-course">&larr; Back</a>
    <header>
        <div class="course-details">
            <h1 class="course-title" id="courseTitle"></h1>
            <p class="course-description" id="courseDescription"></p>
        </div>
    </header>

    <div class="main-content">
        <nav class="lessons-nav">
            <h2>Lessons</h2>
            <ul id="lessonsList">
                <!-- Lessons will be dynamically populated here -->
            </ul>
        </nav>

        <div class="lesson-content" id="lessonContent">
            <!-- Lesson content will be displayed here -->
        </div>
    </div>

    <script src="/js/viewCourse.js"></script>
</body>
</html>
